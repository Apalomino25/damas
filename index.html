<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Damas</title>
  <style>
    body {
      align-items: center;
      background: #1b1b1f;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }

    #menu {
      margin: 48px 16px;
      max-width: 420px;
      text-align: center;
      width: calc(100% - 32px);
    }

    button, input {
      border: 0;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
      margin: 6px;
      padding: 12px 16px;
    }

    button {
      background: #ffd447;
      color: #1b1b1f;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    input {
      text-transform: uppercase;
      width: 120px;
    }

    #onlinePanel[hidden], #game[hidden] {
      display: none;
    }

    #onlinePanel {
      margin-top: 16px;
    }

    #status {
      min-height: 24px;
    }

    #game {
      margin: 16px auto;
      max-width: 100%;
      overflow: auto;
    }

    #musicButton {
      background: #34343a;
      color: #fff;
      font-size: 14px;
      margin-top: 0;
    }

    canvas {
      display: block;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <main id="menu">
    <h1>Damas</h1>
    <p>Elige cómo quieres jugar</p>
    <button id="soloButton" type="button">Jugar contra la IA</button>
    <button id="multiButton" type="button">Multijugador</button>

    <section id="onlinePanel" hidden>
      <button id="createRoomButton" type="button">Crear sala</button>
      <p>O ingresa el código de una sala:</p>
      <input id="roomCodeInput" aria-label="Código de sala" maxlength="4" autocomplete="off">
      <button id="joinRoomButton" type="button">Unirse</button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <div id="game" hidden>
    <button id="musicButton" type="button" aria-pressed="true">♫ Sonido: activado</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
